name = "levinelinks"
main = "src/index.ts"
compatibility_date = "2024-11-29"
workers_dev = false

[[routes]]
pattern = "levine.yet-to-be.com"
custom_domain = true

[vars]
SITE_URL = "https://levine.yet-to-be.com"
EMAIL_DOMAIN = "levine.yet-to-be.com"

[[d1_databases]]
binding = "DB"
database_name = "levinelinks-db"
database_id = "2dc9639b-41f5-4c77-b8f8-5e282d336cca"
migrations_dir = "drizzle"

# Email routing configured via dashboard for yet-to-be.com
# Route: inbox@yet-to-be.com -> this worker

# Service binding for parallel link fetching
# Each fetch() call gets its own subrequest budget (50 free / 1000 paid)
[[services]]
binding = "FETCHER"
service = "levinelinks"

[triggers]
crons = ["0 * * * *"]
